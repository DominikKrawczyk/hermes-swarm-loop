[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-swarm-loop"
version = "6.4.0"
description = "Hermes Swarm Loop — multi-agent orchestration framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Edward Puszczyk", email = "edward@puszczyk.dev"},
]

keywords = ["agent", "swarm", "orchestration", "hermes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "rich>=13.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/DominikKrawczyk/hermes-swarm-loop"
Repository = "https://github.com/DominikKrawczyk/hermes-swarm-loop"
Issues = "https://github.com/DominikKrawczyk/hermes-swarm-loop/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*", "*_test"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-q",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true
ignore_missing_imports = false

# Per-module overrides
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
