name: Hermes Swarm Loop Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Lint with pyright
        run: |
          pip install pyright
          pyright engine/ scaling/ tests/ || true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file consistency
        run: |
          echo "Checking critical file presence..."
          for f in bootstrap.py engine/__init__.py engine/state_machine.py \
                   engine/mastery_gate.py engine/gate_11.py engine/workspace_manager.py \
                   scaling/__init__.py scaling/token_bucket.py \
                   scaling/adaptive_batcher.py scaling/cas_store.py \
                   scaling/circuit_breaker.py scaling/connection_pool.py \
                   scaling/priority_queue.py scaling/queue_pressure.py \
                   configs/engine_config.yaml configs/scaling_config.yaml \
                   configs/mastery_gate_config.yaml configs/yolo_config.yaml \
                   configs/workspace_config.yaml; do
            test -f "$f" && echo "✅  $f" || echo "❌  $f MISSING"
          done
