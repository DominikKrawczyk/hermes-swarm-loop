# Hermes Swarm Loop — Workspace Configuration
# ============================================
# Controls workspace lifecycle — kinds, paths, naming conventions.

workspace:
  base_dir: "/opt/hermes-swarm-loop"
  git_repo: "/opt/hermes-swarm-loop/.git"
  default_kind: "scratch"

  kinds:
    scratch:
      label: "Scratch"
      description: "Fresh tmp directory — worker's exclusive space"
      default: true
      gc_on_complete: true
      isolation: strong
      persistence: false

    dir:
      label: "Directory"
      description: "Shared persistent directory — multiple workers read/write"
      default: false
      gc_on_complete: false
      isolation: shared
      persistence: true
      shared_path: null  # defaults to base_dir/shared/<task_id>

    worktree:
      label: "Worktree"
      description: "Git worktree — branch-per-task development"
      default: false
      gc_on_complete: false
      isolation: branch
      persistence: true
      auto_commit: true
      branch_prefix: "wt/"

  naming:
    worktree_prefix: "wt/"
    shared_prefix: "shared/"
