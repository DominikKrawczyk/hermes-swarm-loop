# ─── Hermes Swarm Loop — YOLO Configuration ───
# YOLO (You Only Live Once) governs auto-approval behaviour.
# When active, all tool calls are auto-approved — no confirmations.

# YOLO zone definitions
# Each zone has a safety level and parallel capacity
zones:
  safe:
    label: "Safe"
    description: "Manual approval for all actions"
    auto_approve: false
    max_parallel: 5
    safety_valve_enabled: true
    requires_human: true

  test:
    label: "Test"
    description: "Auto-approve all actions, limited parallelism"
    auto_approve: true
    max_parallel: 11
    safety_valve_enabled: true
    nested_check: true

  staging:
    label: "Staging"
    description: "Auto-approve, moderate parallelism"
    auto_approve: true
    max_parallel: 33
    safety_valve_enabled: true

  production:
    label: "Production"
    description: "Full YOLO, maximum parallelism"
    auto_approve: true
    max_parallel: 999
    safety_valve_enabled: false

# Safety valve configuration
# When enabled, trips after N consecutive errors and blocks further actions
safety_valve:
  enabled: true
  consecutive_error_threshold: 5
  max_consecutive_approvals: 50
  max_loc_changed: 1000
  cooldown_seconds: 300
  block_message: "Safety valve tripped — too many consecutive errors"

# Default zone (used when none is specified)
default_zone: test

# Escalation chain — order in which zones are escalated
escalation_chain:
  - hardline_floor
  - yolo
  - manual

# Subagent inheritance — how subagents inherit their parent's YOLO zone
subagent_inheritance:
  chain:
    - root
    - phase
    - point
    - agent
  default_zone: test
