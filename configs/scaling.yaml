# Scaling Configuration — 7 modules
# Controls adaptive scaling of agents, rate limits, and circuit breakers

token_bucket:
  enabled: true
  default_rate: 100
  default_burst: 200
  per_worker_rate: 10
  refill_interval_ms: 100

adaptive_batcher:
  enabled: true
  min_batch_size: 1
  max_batch_size: 33
  target_latency_ms: 500
  scale_up_threshold: 0.8
  scale_down_threshold: 0.3

cas_store:
  enabled: true
  retry_on_conflict: 3
  lock_timeout_ms: 5000
  wal_mode: true

circuit_breaker:
  enabled: true
  failure_threshold: 5
  recovery_timeout_ms: 30000
  half_open_max_requests: 3
  consecutive_successes_to_close: 2

connection_pool:
  enabled: true
  min_connections: 2
  max_connections: 33
  idle_timeout_seconds: 60
  max_lifetime_seconds: 300

priority_queue:
  enabled: true
  default_priority: 5
  max_priority: 10
  aging_factor: 0.1
  age_interval_seconds: 60

queue_pressure:
  enabled: true
  pressure_threshold: 0.8
  backpressure_factor: 0.5
  max_queue_depth: 1000
  auto_throttle: true
